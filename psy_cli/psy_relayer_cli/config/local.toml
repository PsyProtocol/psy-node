# Reference template — locSetupV4 generates the actual daemon.toml at runtime
# with absolute paths resolved from the current machine.
rpc_config = "psy-genesis/config.json"
services_url = "http://127.0.0.1:3000"
withdraw_method_id = 3055054724
proof_dir = "local_checkpoints/bridge_proposer"
poll_interval_secs = 15
confirmation_lag_checkpoints = 3
max_checkpoint_batch = 32

[relayer_wallet]
sign_type = "ZKSign"
keystore_path = "<HOME>/.psy/keystore/bridge-relayer"

[finalize]
l1_rpc_url = "http://127.0.0.1:8545"
deployments_network = "localhost"
keystore_path = "<HOME>/.psy/keystore/bridge-relayer"
password_env = "WALLET_PASSWORD"

[[chains]]
family = "evm"
chain_index = 0
network_id = "localhost"
rpc_urls = ["http://127.0.0.1:8545"]
deployments_network = "localhost"
keystore_path = "<HOME>/.psy/keystore/bridge-relayer"
password_env = "WALLET_PASSWORD"

[[chains]]
family = "evm"
chain_index = 1
network_id = "localhostBsc"
rpc_urls = ["http://127.0.0.1:9545"]
deployments_network = "localhostBsc"
keystore_path = "<HOME>/.psy/keystore/bridge-relayer"
password_env = "WALLET_PASSWORD"

[[chains]]
family = "evm"
chain_index = 2
network_id = "localhostBase"
rpc_urls = ["http://127.0.0.1:10545"]
deployments_network = "localhostBase"
keystore_path = "<HOME>/.psy/keystore/bridge-relayer"
password_env = "WALLET_PASSWORD"
