type Deposit @entity {
  id: ID!
  chain_id: Int!
  deposit_index: Int!               # global L1 bridge deposit index
  chain_local_deposit_index: Int!   # dense per-chain helper-tree index
  shield_address: String!
  token: String!
  l2_token_contract_id: String!
  amount: BigInt!
  note_commitment: String!
  chain_index: Int!
  leaf_hash: String!
  block_number: Int!
  tx_hash: String!
}

type FinalizedBatch @entity {
  id: ID!
  chain_id: Int!
  finalized_checkpoint_id: BigInt!
  deposit_tree_root: String!
  withdrawal_tree_root: String!
  block_number: Int!
  tx_hash: String!
}

# ── Current per-chain deposit tree metadata ─────────────────────────────────
# Tracks the current per-chain Poseidon helper tree as deposits arrive.
# `last_count` is the current dense append count for this chain's helper tree
# (that is, the number of deposits from this chain that have been absorbed into
# the current tree state), not a finalized/proved counter.
#
# `finalized_keccak_deposit_tree_root` / `last_finalized_checkpoint_id` remain
# audit/debug metadata copied from StateManager.Finalized and are not the source
# of truth for Poseidon claim roots.
type DepositTreeMeta @entity {
  id: ID!                         # "{chain_index}"
  chain_index: Int!
  chain_id: Int                   # owning EVM id; collision guard for one Envio / many L1s
  last_count: Int!                # current per-chain helper-tree count
  poseidon_deposit_tree_root: String!   # current per-chain Poseidon root
  deposit_tree_root: String!             # backwards-compatible alias
  finalized_keccak_deposit_tree_root: String!
  last_finalized_checkpoint_id: BigInt!
  block_number: Int!
  tx_hash: String!
}

# ── Current per-chain deposit tree nodes ─────────────────────────────────────
# Maintains the CURRENT Poseidon helper tree for each chain_index. Nodes are
# updated incrementally on every DepositRecorded. Historical roots / proofs for
# older tree counts are reconstructed from the current nodes plus the requested
# snapshot boundary.
#
# Keyed by (chain_index, level, node_index). Namespace uses chain_index
# (not chain_id), consistent with set_chain_root(chain_index, ...).
type DepositTreeNode @entity {
  id: ID!                         # "{chain_index}:{level}:{node_index}"
  chain_index: Int!
  level: Int!                     # 0 = leaf, 32 = root
  node_index: BigInt!
  hash: String!                   # Poseidon QHashOut display hex
  block_number: Int!
  tx_hash: String!
}

type WithdrawalClaim @entity {
  id: ID!
  chain_id: Int!
  nullifier: String!
  recipient: String!
  token: String!
  amount: BigInt!
  block_number: Int!
  tx_hash: String!
}
