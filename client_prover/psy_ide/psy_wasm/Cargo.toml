[package]
name = "psy_wasm"
edition = "2021"
version = "0.1.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["console"] }
console_error_panic_hook = { workspace = true }
anyhow = { workspace = true }

# Native: no is_sync feature
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
psy_compiler = { workspace = true }
psy_vm = { workspace = true }
psy_client_data = { workspace = true }

# WASM: enable is_sync so maybe-async generates synchronous code
[target.'cfg(target_arch = "wasm32")'.dependencies]
psy_compiler = { workspace = true, features = ["is_sync"] }
psy_vm = { workspace = true, features = ["is_sync"] }
psy_client_data = { workspace = true, features = ["is_sync"] }

[features]
default = []
