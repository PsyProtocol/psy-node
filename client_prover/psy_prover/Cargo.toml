[package]
edition = "2021"
name    = "psy_prover"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Minimal core dependencies for WASM
maybe-async = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
plonky2 = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
thiserror = { workspace = true }

psy_client_common = { workspace = true }
psy_config = { workspace = true }
psy_common_circuit = { workspace = true, default-features = false }
psy_network_circuit = { workspace = true, default-features = false }
psy_dpn_circuit = { workspace = true, default-features = false }
psy_vm = { workspace = true }
psy_client_data = { workspace = true, default-features = false }
psy_compiler = { workspace = true }
psy_crypto = { workspace = true }
psy_provider = { workspace = true }
psy_ups_circuit = { workspace = true, default-features = false }
psy_core = { workspace = true }
psy_data = { workspace = true }
psy_plonky2_common_circuits = { path = "../../psy_plonky2_common_circuits", default-features = false, features = ["std"] }
psy_plonky2_circuits = { path = "../../psy_plonky2_circuits", default-features = false, features = ["std", "serialize_speedy"] }
psy_plonky2_basic_helpers = { workspace = true }
parth_core = { workspace = true }

k256 = { workspace = true }
rand = { workspace = true }
getrandom = { workspace = true }
hex = {workspace = true}
dashmap = { workspace = true }
bincode = { workspace = true }

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kvq = { workspace = true }
serde_cbor = { workspace = true }
# psy_store = { workspace = true, default-features = false }
futures = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
jsonrpsee = { workspace = true }
reqwest = { workspace = true }
sodalite = { workspace = true }
secp256k1 = { workspace = true }
dirs = {workspace = true}
rpassword = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-primitives = { workspace = true }
parking_lot = { workspace = true}
http = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
quick_cache = { workspace = true }
gnark-plonky2-verifier-ffi = { workspace = true, optional = true }

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
wasm-logger = { workspace = true }
wasm-tracing = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window"] }
js-sys = { workspace = true }

[dev-dependencies]
flate2 = { workspace = true }

[features]
gnark-wrap = ["dep:gnark-plonky2-verifier-ffi", "psy_plonky2_circuits/gnark-wrap"]
# default = ["is_sync"]
is_sync = [
    "maybe-async/is_sync",
]
