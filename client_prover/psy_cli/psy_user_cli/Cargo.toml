[package]
build = "build.rs"
edition = "2021"
name = "psy_user_cli"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
plonky2 = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
psy_crypto = { workspace = true }
psy_common_circuit = { workspace = true }
psy_dpn_circuit = { workspace = true }
psy_ups_circuit = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
psy_client_common = { workspace = true }
psy_cli_common = { path = "../../../psy_cli/psy_cli_common" }
psy_vm = { workspace = true }
psy_compiler = { workspace = true }
psy_prover = { workspace = true, default-features = false }
psy_client_data = { workspace = true }
# psy_rust_sdk = { workspace = true }
psy_provider = { workspace = true }
psy_config = { workspace = true }
# psy_node = { workspace = true }
# psy_store = { workspace = true, default-features = false }
kvq = { workspace = true }
hashbrown = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
tiny-keccak = { workspace = true }
k256 = { workspace = true }
rand = { workspace = true }
serde_with = { workspace = true }
bincode = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
dashmap = { workspace = true }
ts-rs =  { workspace = true }
clap = { workspace = true }
dotenv = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
cfg-if = {workspace = true}
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
serde-wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
wasm-logger = { workspace = true }
wasm-tracing = { workspace = true }
rpassword = { workspace = true }

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
alloy-primitives = { workspace = true }
alloy-consensus = "=1.6.3"
alloy-eips = "=1.6.3"
alloy-provider = { workspace = true }
alloy-network = "=1.6.3"
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
shadow-rs = { workspace = true }
nostr-sdk = { version = "0.44", features = ["nip44", "nip59"] }
tokio-tungstenite = "0.24"
futures-util = { workspace = true }

# Native-only build dependencies
[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
shadow-rs = { workspace = true }

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
#reqwest = { version = "0.12", default-features = false }
reqwest = { workspace = true, features = ["json"] }

[dev-dependencies]
serde_cbor = { workspace = true }
zstd = { workspace = true }

[features]
default = ["gnark-wrap"]
gnark-wrap = ["psy_prover/gnark-wrap"]
is_sync = ["psy_prover/is_sync"]
