[workspace]
members = [
    "pser",
    "parth_core",
    "psy_core",
    "psy_node_core",
    "parth_node_core",
    "parth_node_v1",
    "parth_p2"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
version = "0.1.0"

[workspace.lints]

[workspace.dependencies]
colored = "2"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.4.0", features = ["hex"] }
serde_repr = "0.1.19"
hex = "0.4.3"
hex-literal = "0.4.1"
anyhow = "1.0.75"
async-trait = { version = "0.1.88" }
chrono = "0.4.39"
rand = "0.8.5"
rand_core = "0.9"
rand_pcg = "0.9"
#bincode = { version = "=2.0.1", features = ["serde"] }
bincode = { version = "=1.3.3" }
serde_cbor = { version = "0.11.2" }
auto_impl = "1"
strum = "0.27"
strum_macros = "0.27"
scylla = "1.3.1"
thiserror = "2.0"
tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.17", features = [
    "std",
    "env-filter",
    "json",
    "chrono",
] }
bytes = "1"
sha2 = "0.10.8"
sha3 = "0.10.8"
num = { version = "0.4.0", default-features = false }
postcard = { version = "1.1.3", default-features = true, features = ["alloc", "use-std"] }
log = { version = "0.4.14", default-features = false }
env_logger = { version = "0.11", default-features = false }
hashbrown = "0.14.5"
rkyv = "0.8.12"

k256 = { version = "0.13.2", features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
  "precomputed-tables",
  "schnorr",
  "signature",
  "std",
  "serde",
] }
ecdsa = "0.16.0"
flate2 = "1.0"

tokio = { version = "1.43.0", features = ["full"] }
tokio-executor-trait = "2.1.3"
tokio-reactor-trait = "2"

futures = "0.3.0"
chalk = "0.1"
proc-macro2 = { version = "1.0", features = ["span-locations"] }

uuid = { version = "1.0", features = ["serde", "v4", "js"] }

num-traits = "0.2"

futures-util = "0.3.28"
maybe-async = { version = "0.2", default-features = false }

async-nats = "0.43.1"
speedy = "0.8.7"

parth_core = { path = "./parth_core" }

psy_core = { path = "./psy_core" }
pser = { path = "./pser" }
psy_node_core = { path = "./psy_node_core" }

plonky2 = { git = "https://github.com/clint-long/plonky2-hwa", rev = "5bf6940a3ea2d27e854931787e93bb46be27ffa3" }
plonky2_maybe_rayon = { git = "https://github.com/clint-long/plonky2-hwa", rev = "5bf6940a3ea2d27e854931787e93bb46be27ffa3", default-features = false }

redis = { version = "0.30.0", default-features = false, features = [
    "acl",
    "keep-alive",
    "script",
    "tokio-comp",
    "connection-manager",
    "r2d2"
] }
bb8-redis = "0.22.0"
bb8 = "0.9"
rsmq = { git = "https://github.com/jimzk/rsmq-async-rs", package = "rsmq_async", features = ["break-js-comp", "sync", "tokio"] }


# Dev dependencies
criterion = "0.5.1"  # For benchmarking efficiency

[profile.release]
debug = true

