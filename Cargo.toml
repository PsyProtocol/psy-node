[workspace]
members = [
    "pser",
    "pderive",
    "parth_core",
    "parth_common",
    "psy_scratchpad",
    "psy_type_defaults",
    "psy_core",
    "psy_common",
    "psy_data",
    "psy_node_core",
    "psy_node_common",
    "psy_node_redis",
    "psy_node_scylla",
    "psy_node_nats",
    "psy_node_store_memory"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
version = "0.1.0"

[workspace.lints]

[workspace.dependencies]
syn = { version = "2.0", features = ["full"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"



colored = "2"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.4.0", features = ["hex"] }
serde_repr = "0.1.19"
hex = "0.4.3"
hex-literal = "0.4.1"
anyhow = "1.0.75"
async-trait = { version = "0.1.88" }
chrono = "0.4.39"
rand = "0.8.5"
rand_core = "0.9"
rand_pcg = "0.9"
#bincode = { version = "=2.0.1", features = ["serde"] }
bincode = { version = "=1.3.3" }
serde_cbor = { version = "0.11.2" }
auto_impl = "1"
strum = "0.27"
strum_macros = "0.27"
scylla = "1.3.1"
thiserror = "2.0"
tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.17", features = [
    "std",
    "env-filter",
    "json",
    "chrono",
] }
bytes = "1"
sha2 = "0.10.8"
sha3 = "0.10.8"
num = { version = "0.4.0", default-features = false }
postcard = { version = "1.1.3", default-features = true, features = ["alloc", "use-std"] }
speedy = "0.8.7"
rkyv = "0.8.12"

log = { version = "0.4.14", default-features = false }
env_logger = { version = "0.11", default-features = false }
hashbrown = "0.14.5"

ts-rs = "10.1.0"
k256 = { version = "0.13.2", features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
  "precomputed-tables",
  "schnorr",
  "signature",
  "std",
  "serde",
] }
ecdsa = "0.16.0"
flate2 = "1.0"

tokio = { version = "1.43.0", features = ["full"] }
tokio-executor-trait = "2.1.3"
tokio-reactor-trait = "2"

futures = "0.3.0"
chalk = "0.1"

uuid = { version = "1.0", features = ["serde", "v4", "js"] }

num-traits = "0.2"

futures-util = "0.3.28"
maybe-async = { version = "0.2", default-features = false }

async-nats = "0.43.1"

plonky2 = { git = "https://github.com/PsyRepoForks/plonky2-hwa", rev = "94d6d252a5c63bd74f8d1282550dc834555d8242" }
plonky2_maybe_rayon = { git = "https://github.com/PsyRepoForks/plonky2-hwa", rev = "94d6d252a5c63bd74f8d1282550dc834555d8242", default-features = false }

redis = { version = "0.30.0", default-features = false, features = [
    "acl",
    "keep-alive",
    "script",
    "tokio-comp",
    "connection-manager",
    "r2d2"
] }
bb8-redis = "0.22.0"
bb8 = "0.9"
rsmq = { git = "https://github.com/jimzk/rsmq-async-rs", package = "rsmq_async", features = ["break-js-comp", "sync", "tokio"] }
dashmap = "6.1.0"
parking_lot = "0.12.5"
# Workspace Packages

pser = { path = "./pser" }
pderive = { path = "./pderive" }

parth_core = { path = "./parth_core" }
parth_common = { path = "./parth_common" }
parth_crypto = { path = "./parth_crypto" }



psy_core = { path = "./psy_core" }
psy_data = { path = "./psy_data" }
psy_common = { path = "./psy_common" }
psy_node_core = { path = "./psy_node_core" }
psy_node_common = { path = "./psy_node_common" }
psy_scratchpad = { path = "./psy_scratchpad" }
psy_type_defaults = { path = "./psy_type_defaults" }

psy_node_redis = { path = "./psy_node_redis" }
psy_node_nats = { path = "./psy_node_nats" }


# Dev dependencies
criterion = { version = "0.5.1", features = ["async_tokio"] }

[profile.release]
debug = true

