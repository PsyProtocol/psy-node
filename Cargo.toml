[workspace]
members = [
    "cf_utils",
    "psy_io",
    "psy_serialize",
    "pser",
    "pderive",
    "parth_core",
    "parth_common",
    "psy_scratchpad",
    "psy_type_defaults",
    "psy_core",
    "psy_common",
    "psy_data",
    "psy_node_core",
    "psy_node_common",
    "psy_node_redis",
    "psy_node_scylla",
    "psy_node_nats",
    "psy_node_store_memory",
    "psy_node_v3",
    "psy_dummy_proof",
    "psy_plonky2_worker",
    "psy_plonky2_basic_helpers",
    "psy_plonky2_common_circuits",
    "psy_plonky2_circuits",
    "psy_plonky2_testbed"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
version = "0.1.0"

[workspace.lints]

[workspace.dependencies]

syn = { version = "2.0", features = ["full"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
paste = "1.0.15"
const_format = "0.2.35"
crossbeam-skiplist = "0.1"

colored = "2"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.4.0", features = ["hex", "macros"] }
serde_repr = "0.1.19"
hex = "0.4.3"
hex-literal = "0.4.1"
anyhow = "1.0.75"
async-trait = { version = "0.1.88" }
chrono = "0.4.39"
rand = "0.8.5"
rand_core = "0.9"
rand_pcg = "0.9"
rand_chacha = "0.3"
#bincode = { version = "=2.0.1", features = ["serde"] }
bincode = { version = "=1.3.3" }
serde_cbor = { version = "0.11.2" }
auto_impl = "1"
strum = "0.27"
strum_macros = "0.27"
scylla = "1.3.1"
thiserror = "2.0"
tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.17", features = [
    "std",
    "env-filter",
    "json",
    "chrono",
] }
bytes = "1"
bytemuck = { version = "1.24.0", features = ["derive", "min_const_generics", "extern_crate_alloc"] }
sha2 = "0.10.8"
sha3 = "0.10.8"
num = { version = "0.4.0", default-features = false }
postcard = { version = "1.1.3", default-features = true, features = ["alloc", "use-std"] }
speedy = "0.8.7"
rkyv = { version = "0.8.12" }

log = { version = "0.4.14", default-features = false }
env_logger = { version = "0.11", default-features = false }
hashbrown = "0.14.5"
embedded-io = "0.7.0"
embedded-io-async = "0.7.0"

ts-rs = "10.1.0"
k256 = { version = "0.13.2", features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
  "precomputed-tables",
  "schnorr",
  "signature",
  "std",
  "serde",
] }
ecdsa = "0.16.0"
flate2 = "1.0"

tokio = { version = "1.43.0", features = ["full"] }
tokio-executor-trait = "2.1.3"
tokio-reactor-trait = "2"

futures = "0.3.0"
chalk = "0.1"
rayon = "1.11.0"
uuid = { version = "1.0", features = ["serde", "v4", "js"] }

num-traits = "0.2"

futures-util = "0.3.28"
maybe-async = { version = "0.2", default-features = false }

async-nats = "0.43.1"

jsonrpsee = { version = "0.26", features = ["server", "client", "macros"] }
config = "0.15"
plonky2 = { git = "https://github.com/PsyRepoForks/plonky2-hwa", rev = "8d5b56f42fe87942312f270a5dc26c0059f973fb" }
plonky2_maybe_rayon = { git = "https://github.com/PsyRepoForks/plonky2-hwa", rev = "8d5b56f42fe87942312f270a5dc26c0059f973fb", default-features = false }

redis = { version = "0.30.0", default-features = false, features = [
    "acl",
    "keep-alive",
    "script",
    "tokio-comp",
    "connection-manager",
    "r2d2"
] }
bb8-redis = "0.22.0"
bb8 = "0.9"
rsmq = { git = "https://github.com/PsyRepoForks/rsmq-async-rs", package = "rsmq_async", features = ["break-js-comp", "sync", "tokio"] }
dashmap = "6.1.0"
parking_lot = "0.12.5"
itertools = "0.14"

bitflags = "2.5.0"

# start server stuff

tower-http = { version = "0.6", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
http = "1"
http-body = "1"
http-body-util = "0.1.0"
hyper = "1.5"
hyper-rustls = { version = "0.27", default-features = false }
hyper-util = "0.1"

# Workspace Packages
cf_utils = { path = "./cf_utils" }

pser = { path = "./pser" }
pderive = { path = "./pderive" }
psy_io = { path = "./psy_io" }
psy_serialize = { path = "./psy_serialize" }
psy_plonky2_basic_helpers = { path = "./psy_plonky2_basic_helpers" }
psy_plonky2_worker = { path = "./psy_plonky2_worker" }
psy_plonky2_common_circuits = { path = "./psy_plonky2_common_circuits" }
psy_plonky2_circuits = { path = "./psy_plonky2_circuits" }

parth_core = { path = "./parth_core" }
parth_common = { path = "./parth_common" }
parth_crypto = { path = "./parth_crypto" }



psy_core = { path = "./psy_core" }
psy_data = { path = "./psy_data" }
psy_common = { path = "./psy_common" }
psy_node_core = { path = "./psy_node_core" }
psy_node_common = { path = "./psy_node_common" }
psy_scratchpad = { path = "./psy_scratchpad" }
psy_type_defaults = { path = "./psy_type_defaults" }

psy_node_redis = { path = "./psy_node_redis" }
psy_node_nats = { path = "./psy_node_nats" }
psy_node_store_memory = { path = "./psy_node_store_memory" }


# Dev dependencies
criterion = { version = "0.5.1", features = ["async_tokio", "async_futures"] }

[profile.release]
debug = true

