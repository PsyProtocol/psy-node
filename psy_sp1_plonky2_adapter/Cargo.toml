[workspace]
members = ["program", "lib", "script"]
resolver = "2"

[workspace.dependencies]
# SP1
sp1-zkvm = { version = "6.0.2" }
sp1-build = { version = "6.0.2" }
sp1-sdk = { version = "6.0.2", features = ["blocking", "native-gnark"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "=1.3.3"
anyhow = "1.0"

# Cryptography
plonky2 = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934", features = ["ts-rs"] }
tiny-keccak = "2.0"

# CLI
clap = { version = "4.0", features = ["derive", "env"] }
hex = "0.4"
dotenv = "0.15"
tracing = "0.1"

[patch.crates-io]
# Route keccak operations through SP1 precompile-optimized tiny-keccak.
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }

[profile.release]
lto = "thin"
codegen-units = 1