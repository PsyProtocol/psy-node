[package]
name = "psy_cli_full_e2e"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
publish = false

# Deployment tooling must not add members to the node runtime workspace.
[workspace]

[[bin]]
name = "psy-cli-full-e2e"
path = "src/main.rs"

[dependencies]
alloy-signer = { version = "=1.6.3", default-features = false }
alloy-signer-local = { version = "=1.6.3", features = ["mnemonic", "keystore"] }
anyhow = "1.0.75"
clap = { version = "4.5.53", features = ["derive", "env"] }
hex = "0.4.3"
libc = "0.2"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "gzip", "rustls-tls"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
