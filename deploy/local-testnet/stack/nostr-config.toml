[info]
name = "psy-local-devnet-nostr"
description = "Local Psy devnet relay for private transfers and deposit recovery"

[database]
engine = "sqlite"
data_directory = "/usr/src/app/db"
min_conn = 4
max_conn = 16

[network]
address = "0.0.0.0"
port = 8081
remote_ip_header = "x-forwarded-for"

[limits]
max_event_bytes = 5242880
max_ws_message_bytes = 5242880
max_ws_frame_bytes = 5242880
messages_per_sec = 20
subscriptions_per_min = 200
max_blocking_threads = 16
event_kind_allowlist = [1059]

[authorization]
nip42_auth = false
nip42_dms = false

[options]
reject_future_seconds = 1800
