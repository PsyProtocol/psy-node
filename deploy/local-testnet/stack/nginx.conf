server {
  listen 8088;
  server_name _;
  root /usr/share/nginx/html/app;
  index index.html;

  location ~ ^/downloads/.*\.zip$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /downloads/ {
    alias /usr/share/nginx/html/downloads/;
    add_header Cache-Control "no-store" always;
  }

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8089;
  server_name _;
  root /usr/share/nginx/html/explorer;
  index index.html;

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8090;
  server_name _;
  root /usr/share/nginx/html/ide;
  index index.html;

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
